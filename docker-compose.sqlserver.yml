# Assignment demonstration overlay. Uses a new named SQL Server volume and
# leaves the existing postgres_data volume and service configuration intact.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: 2048
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in root .env}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - assignment_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [internal]

  backend:
    command: ["sh", "-c", "python -m app.scripts.prepare_sqlserver && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: mssql+pymssql://sa:${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in root .env}@sqlserver:1433/shaha_finlease
      SQLSERVER_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in root .env}
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  assignment_sqlserver_data:
